name: Sync LeetCode submissions

on:
  workflow_dispatch:
  schedule:
    - cron: "17 23 * * *"
      timezone: "America/Puerto_Rico"

permissions:
  contents: write

concurrency:
  group: leetcode-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync accepted solutions
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Sync accepted LeetCode submissions
        uses: joshcai/leetcode-sync@6749b872e89b3c10d213a6e599a7424584c1fa10
        with:
          github-token: ${{ github.token }}
          leetcode-csrf-token: ${{ secrets.LEETCODE_CSRF_TOKEN }}
          leetcode-session: ${{ secrets.LEETCODE_SESSION }}
          destination-folder: "solutions"
          filter-duplicate-secs: "86400"
          verbose: "true"
          commit-header: "[LeetCode Sync]"
